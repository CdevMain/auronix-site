# /etc/nginx/sites-available/auronix.cdev.com.br
# Depois: sudo ln -s /etc/nginx/sites-available/auronix.cdev.com.br /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
#         sudo certbot --nginx -d auronix.cdev.com.br     (o certbot adiciona o bloco 443 e o redirect)

server {
    listen 80;
    listen [::]:80;
    server_name auronix.cdev.com.br;

    client_max_body_size 2m;

    # Arquivos estáticos direto pelo Nginx (os links levam ?v=versão, então podem ficar em cache)
    location ~ ^/(css|js|img)/ {
        root /var/www/auronix/public;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
    location = /favicon.ico {
        root /var/www/auronix/public;
        expires 30d;
        access_log off;
    }

    # Páginas de erro quando o Node está parado ou reiniciando
    error_page 502 /erros/502.html;
    error_page 503 /erros/503.html;
    error_page 504 /erros/504.html;
    location ^~ /erros/ {
        root /var/www/auronix/public;
        internal;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
    }
}
